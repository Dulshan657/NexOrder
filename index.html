<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- /vite.svg has never existed in this repo, so the tab has always shown
         the browser's blank-page glyph. The favicon is app chrome and stays
         NexOrder even on a tenant deployment — the product is ours, the
         documents are theirs (PRODUCTION-LAUNCH-PLAN.md, "Identity"). -->
    <link rel="icon" type="image/png" href="/assets/Nex-Order-no-bg-logo.png" />
    <!-- `interactive-widget=resizes-content` is load-bearing on a handheld and
         is NOT the browser default (that is `resizes-visual`).

         The AppShell root is `h-screen overflow-hidden` and `document.body`
         never scrolls; the only scroller is `<main data-scroll-container>`. Under
         the default, opening Android's soft keyboard shrinks only the VISUAL
         viewport, so `h-screen` keeps its full height and anything anchored to
         the bottom of the layout viewport sits behind the keyboard — including
         the stocktake count sheet's `sticky bottom-0` action bar, which carries
         the Post button, and every Sheet/Modal footer. Because those footers are
         `shrink-0` outside the scrolling body by design, there is nothing to
         scroll and the operator has to dismiss the keyboard to find the button.

         `resizes-content` shrinks the layout viewport instead, so `h-screen`
         means "the part you can actually see" and those footers stay reachable.
         No `user-scalable=no`: pinch-zoom matters on a 5.5-inch screen. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Nex Order</title>
    <style>
      /* Custom Scrollbar Styles for a more minimalistic and consistent theme */
      /* For Webkit browsers (Chrome, Safari, newer Edge) */
      ::-webkit-scrollbar {
        width: 8px;  /* Width of vertical scrollbar */
        height: 8px; /* Height of horizontal scrollbar */
      }
      ::-webkit-scrollbar-track {
        background: transparent; /* Make the track invisible */
      }
      ::-webkit-scrollbar-thumb {
        background-color: #d6d3d1; /* stone-300 */
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box; /* Padding around thumb */
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #a8a29e; /* stone-400 */
      }
      /* For Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #d6d3d1 transparent; /* thumb color track color */
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-stone-50 text-stone-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
