name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Overlay guard (no raw `fixed inset-0` outside components/ui)
        run: node scripts/check-overlays.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
