name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 24 to match the Vercel project's runtime (.vercel/project.json says
      # "24.x"), so CI exercises the same Node the deploy actually runs on.
      # Also required, not merely tidy: `check:csp` imports vercel.ts, and
      # native TypeScript type-stripping only arrives in Node 22.18+/23.6+.
      # On 20 that step dies with "Unknown file extension .ts".
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Overlay guard (no raw `fixed inset-0` outside components/ui)
        run: node scripts/check-overlays.mjs

      # CLAUDE.md is loaded into every agent session and the harness refuses it
      # past 150k chars, at which point none of it is enforcing anything. It hit
      # 173k on 2026-09-10 and was split into docs/claude/; this stops the split
      # being undone one useful paragraph at a time.
      - name: CLAUDE.md size guard (deep detail belongs in docs/claude/)
        run: node scripts/check-claude-md-size.mjs

      # `vh` is the URL-bar-retracted height, and the shell never scrolls the
      # body, so on a handheld ~56px of the app sat below the fold with Sign out
      # in it (F36). Playwright cannot catch this -- its viewport sets the layout
      # and visual viewport together -- so a source assertion is the only guard.
      - name: Viewport-unit guard (no `vh` heights; use `svh`/`dvh`)
        run: node scripts/check-viewport-units.mjs

      - name: CSP guard (vercel.ts CSP + image-proxy ordering, per target)
        run: node scripts/check-csp.mjs

      # Accessibility only -- jsx-a11y and nothing else. The current 276
      # findings are frozen in eslint-suppressions.json, so this passes today
      # and fails the moment a new one appears, including a second violation
      # in a file that already has some. Sits with the other source assertions
      # rather than after the compiler: it is a guard, not a build step.
      - name: Accessibility lint (jsx-a11y)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Builds EVERY target and greps the artifact: demo credentials must ship
      # to the demo host and to no one else. Both directions are asserted.
      #
      # This is also the first thing in CI ever to build a tenant target --
      # `npm run build` above runs with no NEXORDER_ENV, so it has always built
      # `dev` with every module on. Amadiya's module-folded bundle was, until
      # now, compiled for the first time by the deploy that shipped it.
      #
      # Last, because it is the most expensive step and there is nothing to
      # learn from it if the ordinary build is already broken.
      - name: Demo-credential surface (per target, on the built artifact)
        run: npm run check:demo

  # A SECOND JOB, not another step in `verify`. It needs a browser download and
  # a dev server, and neither should sit in the path of a type error.
  a11y:
    name: axe · login surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The only tier where `color-contrast` runs at all: jsdom has no layout and
      # no computed colour, so the axe suite inside `npm test` skips that rule
      # however bad the palette gets.
      #
      # NO CREDENTIALS AND NO DATABASE. lib/supabase.ts throws at module scope on
      # an EMPTY url but never calls out, so a placeholder is enough to boot the
      # app. Same one vitest.config.ts uses, so the host is greppable and cannot
      # reach a live project. That is also why this covers login surfaces only --
      # with no router, they are the only screens reachable without a backend.
      - name: axe (WCAG 2.2 AA)
        run: npx playwright test --project=a11y
        env:
          VITE_SUPABASE_URL: https://testref.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_offline_ci

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 7

  # The Edge Functions' own compiler. `supabase/functions` is excluded from the
  # `tsc` step above and nothing on the frontend imports a function, so until
  # this job the 83 entrypoints were type-checked by nothing at all. A separate
  # job for the same reason as `a11y`: it downloads every remote import (esm.sh,
  # jsr, npm:), and a flaky CDN should not sit in the path of a type error.
  edge:
    name: edge · deno check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Pinned to DENO_VERSION in scripts/check-edge-types.mjs, which is what a
      # developer gets through npx. Bump both together.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: deno check (every function)
        run: node scripts/check-edge-types.mjs

  # Phase B of the gate (docs/claude/briefs.md): the change carries a brief
  # approved before any code, the brief's own tests FAIL on the base and pass
  # on the tip, nothing was weakened to get green, and FINAL says what is not
  # claimed. PRs only — on a push to main there is no base to fail on.
  #
  # The checker runs from the BASE branch's copy, not the PR's: a PR must not
  # be judged by a checker it edited. Only the PR that introduces it (no copy
  # on the base yet) runs its own, and says so.
  brief:
    name: brief · fail-first
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (PR head, full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the brief, fail-first, forbidden moves and FINAL
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          checker="$GITHUB_WORKSPACE/scripts/check-brief.mjs"
          if git cat-file -e "$BASE_REF:scripts/check-brief.mjs" 2>/dev/null; then
            git worktree add --quiet --detach "$RUNNER_TEMP/checker" "$BASE_REF"
            checker="$RUNNER_TEMP/checker/scripts/check-brief.mjs"
          else
            echo "::warning::$BASE_REF has no check-brief.mjs yet — this PR is judged by its own copy"
          fi
          node "$checker" --base="$BASE_REF" --repo="$GITHUB_WORKSPACE" --md="$RUNNER_TEMP/brief.md"

      - name: Report
        if: always()
        run: test -f "$RUNNER_TEMP/brief.md" && cat "$RUNNER_TEMP/brief.md" >> "$GITHUB_STEP_SUMMARY" || true
